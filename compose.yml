name: veyra
services:
  postgres:
    image: postgres:16.13-bookworm
    environment:
      POSTGRES_USER: veyra
      POSTGRES_DB: veyra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyra -d veyra"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks: [data]
  migrate:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    environment:
      DATABASE_URL: postgresql://veyra:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/veyra
    command: ["python", "scripts/migrate.py"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]
  api:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://veyra:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/veyra
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      MEDIAMTX_PLAYBACK_URL: http://mediamtx:9996
      MEDIAMTX_HLS_SECRET: ${MEDIAMTX_HLS_SECRET:?Set MEDIAMTX_HLS_SECRET}
      RECORDINGS_ROOT: /recordings
      PLAYBACK_CACHE_ROOT: /playback-cache
      MEDIA_EGRESS_GUARD_FILE: /media-policy/installed.json
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      mediamtx: {condition: service_started}
    volumes:
      - recordings:/recordings:ro
      - playback-cache:/playback-cache
      - media-policy:/media-policy:ro
    networks: [data, media, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
  worker:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://veyra:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/veyra
      RECORDINGS_ROOT: /recordings
    command: ["python", "services/worker/main.py"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes:
      - recordings:/recordings:ro
    networks: [data, egress]
  web:
    build: {context: ., dockerfile: infra/web.Dockerfile}
    environment:
      API_INTERNAL_URL: http://api:8000
      VEYRA_DEV_TOKEN: ${VEYRA_DEV_TOKEN:?Set VEYRA_DEV_TOKEN in .env}
      WEB_ORIGIN: http://localhost:3000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    networks: [egress]
  mediamtx:
    build: {context: ., dockerfile: infra/media.Dockerfile}
    cap_add: [NET_ADMIN]
    volumes:
      - recordings:/recordings
      - media-policy:/media-policy
    environment:
      MTX_PATHDEFAULTS_RECORDPATH: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f_%z
      MTX_HLSCDNSECRET: ${MEDIAMTX_HLS_SECRET:?Set MEDIAMTX_HLS_SECRET}
      CAMERA_SOURCES_JSON: ${CAMERA_SOURCES_JSON:?Set CAMERA_SOURCES_JSON in .env}
      CAMERA_ALLOWED_CIDRS: ${CAMERA_ALLOWED_CIDRS:-}
      CAMERA_ALLOWED_PORTS: ${CAMERA_ALLOWED_PORTS:-554,8554}
    networks: [media, camera-egress]
  fixture:
    build: {context: ., dockerfile: infra/fixture.Dockerfile}
    profiles: [fixture]
    entrypoint: ["ffmpeg"]
    command: ["-hide_banner", "-loglevel", "warning", "-re", "-f", "lavfi", "-i", "testsrc2=size=640x360:rate=15", "-an", "-c:v", "libx264", "-pix_fmt", "yuv420p", "-preset", "ultrafast", "-tune", "zerolatency", "-g", "15", "-bf", "0", "-f", "rtsp", "-rtsp_transport", "tcp", "rtsp://mediamtx:8554/fixture"]
    depends_on: [mediamtx]
    networks: [media]
volumes:
  postgres-data:
  recordings:
  playback-cache:
  media-policy:
networks:
  data: {internal: true}
  media: {internal: true}
  egress: {}
  camera-egress: {}
