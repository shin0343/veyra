[project]
name = "veyra-api"
version = "0.1.0"
description = "Veyra Phase 01 contracts and application foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
markers = [
  "agent_integration: actual isolated PostgreSQL and application integration",
  "live_meta: genuine first-party Muse API, requires MODEL_API_KEY",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

